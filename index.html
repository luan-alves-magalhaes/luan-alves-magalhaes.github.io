<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luan Alves Magalhães</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1220; --card:#121b2e; --line:#1f2a44; --text:#e8edf7; --muted:#93a0b8; --accent:#4f8cff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Inter',system-ui,sans-serif;background:radial-gradient(1200px 600px at 50% -10%,#1b2a4d 0%,var(--bg) 60%);
    color:var(--text);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:56px 24px;
  }
  .wrap{width:100%;max-width:440px;text-align:center}
  .avatar{
    width:150px;height:150px;border-radius:50%;margin:0 auto 30px;display:grid;place-items:center;
    background:linear-gradient(135deg,#4f8cff,#7b5cff);font-size:40px;font-weight:700;letter-spacing:1px;
    box-shadow:0 10px 30px rgba(79,140,255,.35);border:3px solid rgba(255,255,255,.12);overflow:hidden
  }
  .avatar img{width:100%;height:100%;object-fit:cover}
  h1{font-size:26px;font-weight:700;margin-bottom:10px}
  .role{color:var(--accent);font-weight:600;font-size:15px;margin-bottom:22px}
  .bio{color:var(--muted);font-size:14.5px;line-height:1.75;margin:0 auto 44px;max-width:360px}
  .icons{display:flex;justify-content:center;gap:14px;margin-bottom:26px}
  .icon{
    width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--card);
    border:1px solid var(--line);transition:transform .15s,border-color .15s
  }
  .icon:hover{transform:translateY(-3px);border-color:var(--accent)}
  .icon svg{width:24px;height:24px}
  .links{display:flex;flex-direction:column;gap:12px}
  .btn{
    display:flex;align-items:center;gap:14px;padding:15px 18px;border-radius:14px;background:var(--card);
    border:1px solid var(--line);color:var(--text);text-decoration:none;font-weight:500;font-size:15px;
    transition:transform .15s,border-color .15s,background .15s;text-align:left
  }
  .btn:hover{transform:translateY(-2px);border-color:var(--accent);background:#16213a}
  .btn svg{width:22px;height:22px;flex:none}
  .btn .sub{display:block;color:var(--muted);font-size:12.5px;font-weight:400;margin-top:2px}
  .btn .arrow{margin-left:auto;color:var(--muted);font-size:18px}
  .tags{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:28px 0 8px}
  .tag{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:5px 10px;border-radius:999px}
  footer{margin-top:60px;color:#5f6b84;font-size:12px}
  .logos{display:flex;justify-content:center;gap:46px;margin:0}
  .logo{display:flex;flex-direction:column;align-items:center;gap:14px;text-decoration:none;color:var(--muted);font-size:13px;font-weight:500;transition:transform .15s}
  .logo svg{width:68px;height:68px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
  .logo:hover{transform:translateY(-4px);color:var(--text)}
  .contato{color:var(--muted);font-size:12.5px;margin-top:6px}
</style>
</head>
